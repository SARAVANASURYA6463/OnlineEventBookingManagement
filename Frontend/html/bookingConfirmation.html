<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventEase — Booking Confirmation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f; --card-bg: #111118;
      --border: rgba(255,255,255,0.07); --accent: #3ecfcf;
      --text: #f0f0f5; --muted: #7a7a8c;
      --danger: #ff6584; --success: #3ecfcf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif; min-height: 100vh;
    }

    body::before {
      content: ''; position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(62,207,207,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62,207,207,0.03) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none; z-index: 0;
    }

    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 14px 32px; display: flex;
      align-items: center; justify-content: space-between;
    }

    .navbar-brand {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .navbar-right { display: flex; align-items: center; gap: 12px; }
    .user-name { font-size: 0.9rem; font-weight: 500; }

    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(62,207,207,0.2); border: 1px solid rgba(62,207,207,0.4);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 700; color: var(--accent);
    }

    .main {
      position: relative; z-index: 1;
      max-width: 640px; margin: 0 auto; padding: 40px 24px;
    }

    /* Two column layout */
    .booking-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 600px) {
      .booking-grid { grid-template-columns: 1fr; }
    }

    /* Event Details Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px; padding: 28px;
      animation: fadeUp 0.4s ease both;
    }

    .card-title {
      font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 1rem; margin-bottom: 18px;
      color: var(--accent);
      display: flex; align-items: center; gap: 8px;
    }

    .detail-row {
      display: flex; justify-content: space-between;
      align-items: flex-start; padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { font-size: 0.76rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-value { font-size: 0.88rem; font-weight: 500; text-align: right; max-width: 60%; }

    /* Type badge */
    .type-badge {
      display: inline-block; padding: 2px 10px; border-radius: 8px;
      font-size: 0.7rem; font-weight: 600; font-family: 'Syne', sans-serif;
      background: rgba(62,207,207,0.12); color: var(--accent);
      border: 1px solid rgba(62,207,207,0.25);
    }

    /* Form */
    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block; font-size: 0.76rem; font-weight: 500;
      color: var(--muted); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%; padding: 11px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s;
    }

    .form-group input:focus { border-color: var(--accent); }
    .form-group input::placeholder { color: var(--muted); }

    /* Alert */
    .alert-box {
      padding: 11px 14px; border-radius: 10px;
      font-size: 0.82rem; margin-bottom: 14px; display: none;
    }
    .alert-error { background: rgba(255,101,132,0.12); border: 1px solid rgba(255,101,132,0.3); color: var(--danger); }
    .alert-box.show { display: block; }

    /* Confirm button */
    .confirm-btn {
      width: 100%; padding: 14px; border-radius: 12px;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem;
      border: none; cursor: pointer;
      background: var(--accent); color: #0a0a0f;
      transition: all 0.25s; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .confirm-btn:hover { background: #2db8b8; transform: translateY(-2px); box-shadow: 0 10px 30px rgba(62,207,207,0.35); }
    .confirm-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .back-link {
      display: block; text-align: center; margin-top: 14px;
      color: var(--muted); font-size: 0.83rem;
      text-decoration: none; cursor: pointer; transition: color 0.2s;
    }
    .back-link:hover { color: var(--text); }

    .spinner {
      width: 17px; height: 17px;
      border: 2px solid rgba(0,0,0,0.2); border-top-color: #0a0a0f;
      border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
    }
    .spinner.show { display: block; }

    /* Tickets badge */
    .tickets-info {
      background: rgba(62,207,207,0.08);
      border: 1px dashed rgba(62,207,207,0.3);
      border-radius: 10px; padding: 10px 14px;
      font-size: 0.82rem; color: var(--accent);
      margin-bottom: 18px; text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">EventEase</div>
    <div class="navbar-right">
      <div class="user-name" id="userName">Loading...</div>
      <div class="avatar" id="userAvatar">U</div>
    </div>
  </nav>

  <div class="main">

    <div style="margin-bottom:20px;">
      <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:4px;">Confirm Booking</div>
      <div style="color:var(--muted);font-size:0.86rem;">Review event details and fill in your information</div>
    </div>

    <div class="booking-grid">

      <!-- Left: Event Details -->
      <div class="card" style="animation-delay:0.05s">
        <div class="card-title">🎟️ Event Details</div>

        <div class="detail-row">
          <div class="detail-label">Event</div>
          <div class="detail-value" id="eventName">—</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Type</div>
          <div class="detail-value"><span class="type-badge" id="eventType">—</span></div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Date</div>
          <div class="detail-value" id="eventDate">—</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Time</div>
          <div class="detail-value" id="eventTime">—</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Location</div>
          <div class="detail-value" id="eventLocation">—</div>
        </div>
        <div class="detail-row">
          <div class="detail-label">Seats Left</div>
          <div class="detail-value" style="color:var(--success)" id="eventSeats">—</div>
        </div>
      </div>

      <!-- Right: Attendee Form -->
      <div class="card" style="animation-delay:0.1s">
        <div class="card-title">👤 Your Details</div>

        <div class="tickets-info" id="ticketsInfo">🎟️ Booking 1 ticket</div>

        <div class="alert-box alert-error" id="errorMsg"></div>

        <div class="form-group">
          <label>Full Name *</label>
          <input type="text" id="attendeeName" placeholder="Enter your full name"/>
        </div>

        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="attendeeEmail" placeholder="your@email.com"/>
        </div>

        <div class="form-group">
          <label>Phone Number *</label>
          <input type="tel" id="attendeePhone" placeholder="+91 9876543210"/>
        </div>

        <button class="confirm-btn" id="confirmBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">✅ Confirm Booking</span>
        </button>

        <a class="back-link" onclick="history.back()">← Go back</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/bookingConfirmation.js"></script>
</body>
</html>
