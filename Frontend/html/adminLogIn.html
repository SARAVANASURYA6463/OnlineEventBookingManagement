<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventEase — Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--card-bg:#111118;--border:rgba(255,255,255,0.07);--accent:#ff6584;--text:#f0f0f5;--muted:#7a7a8c;--danger:#ff6584;--success:#3ecfcf;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow:hidden;}
    body::before{content:'';position:fixed;inset:0;
      background-image:linear-gradient(rgba(255,101,132,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,101,132,0.04) 1px,transparent 1px);
      background-size:60px 60px;pointer-events:none;z-index:0;}
    .blob{position:fixed;border-radius:50%;filter:blur(130px);pointer-events:none;z-index:0;opacity:.18;}
    .blob-1{width:500px;height:500px;background:#ff6584;top:-150px;right:-100px;}
    .blob-2{width:400px;height:400px;background:#6c63ff;bottom:-100px;left:-100px;}
    .page-wrapper{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;}
    .brand{text-align:center;margin-bottom:40px;animation:fadeDown .6s ease both;}
    .brand-badge{display:inline-block;font-size:11px;font-family:'Syne',sans-serif;font-weight:600;letter-spacing:3px;text-transform:uppercase;
      color:var(--accent);background:rgba(255,101,132,.12);border:1px solid rgba(255,101,132,.25);border-radius:100px;padding:6px 18px;margin-bottom:16px;}
    .brand h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2rem,4vw,3rem);
      background:linear-gradient(135deg,#fff 30%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .brand p{color:var(--muted);font-size:.9rem;margin-top:8px;}
    .form-card{background:var(--card-bg);border:1px solid var(--border);border-radius:24px;padding:40px 36px;width:100%;max-width:440px;animation:fadeUp .6s .1s ease both;}
    .form-group{margin-bottom:20px;}
    .form-group label{display:block;font-size:.76rem;font-weight:500;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
    .form-group input{width:100%;padding:13px 16px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
      color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;}
    .form-group input:focus{border-color:var(--accent);}
    .form-group input::placeholder{color:var(--muted);}
    .submit-btn{width:100%;padding:15px;border-radius:14px;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;
      border:none;cursor:pointer;background:var(--accent);color:#fff;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .submit-btn:hover{background:#e8506f;transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,101,132,.35);}
    .submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
    .alert-box{padding:12px 16px;border-radius:12px;font-size:.85rem;margin-bottom:20px;display:none;}
    .alert-error{background:rgba(255,101,132,.12);border:1px solid rgba(255,101,132,.3);color:var(--danger);}
    .alert-success{background:rgba(62,207,207,.12);border:1px solid rgba(62,207,207,.3);color:var(--success);}
    .alert-box.show{display:block;}
    .spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
    .spinner.show{display:block;}
    .contact-note{text-align:center;margin-top:20px;font-size:.82rem;color:var(--muted);}
    .back-link{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:.82rem;text-decoration:none;transition:color .2s;}
    .back-link:hover{color:var(--text);}
    @keyframes fadeDown{from{opacity:0;transform:translateY(-20px);}to{opacity:1;transform:translateY(0);}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="page-wrapper">
    <div class="brand">
      <div class="brand-badge">⚙️ Admin Portal</div>
      <h1>Admin Login</h1>
      <p>Restricted access — authorized personnel only</p>
    </div>
    <div class="form-card">
      <div class="alert-box alert-error" id="errorMsg"></div>
      <div class="alert-box alert-success" id="successMsg"></div>
      <div class="form-group">
        <label>Admin ID</label>
        <input type="text" id="adminId" placeholder="Enter your Admin ID"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password"/>
      </div>
      <button class="submit-btn" id="loginBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">🔐 Admin Login</span>
      </button>
      <div class="contact-note">or <strong>Contact Admin Office</strong> for access</div>
    </div>
    <a href="/html/Home.html" class="back-link">← Back to Home</a>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/adminLogIn.js"></script>
</body>
</html>
