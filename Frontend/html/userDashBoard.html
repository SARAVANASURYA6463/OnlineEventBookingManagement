<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventEase — User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f; --card-bg: #111118; --border: rgba(255,255,255,0.07);
      --accent: #3ecfcf; --text: #f0f0f5; --muted: #7a7a8c;
      --danger: #ff6584; --success: #3ecfcf; --warning: #ff9f43;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(62,207,207,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(62,207,207,0.03) 1px, transparent 1px);
      background-size: 60px 60px; pointer-events: none; z-index: 0;
    }
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.9); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-brand {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem;
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .navbar-right { display: flex; align-items: center; gap: 16px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(62,207,207,0.2); border: 1px solid rgba(62,207,207,0.4);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 700; color: var(--accent);
    }
    .user-info { text-align: right; }
    .user-name { font-size: 0.9rem; font-weight: 500; }
    .user-id { font-size: 0.72rem; color: var(--muted); }
    .logout-btn {
      background: rgba(255,101,132,0.1); border: 1px solid rgba(255,101,132,0.25);
      color: var(--danger); border-radius: 10px; padding: 8px 16px;
      font-size: 0.82rem; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    }
    .logout-btn:hover { background: rgba(255,101,132,0.2); }
    .main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 40px 24px; }
    .page-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.8rem; margin-bottom: 6px; }
    .page-subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-tab {
      padding: 7px 16px; border-radius: 100px; font-size: 0.8rem; font-weight: 500;
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif;
    }
    .filter-tab.active, .filter-tab:hover { background: rgba(62,207,207,0.1); border-color: rgba(62,207,207,0.3); color: var(--accent); }
    .search-wrap { position: relative; margin-bottom: 24px; }
    .search-input {
      width: 100%; padding: 14px 18px; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 14px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }
    .event-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px 24px; margin-bottom: 12px; display: flex;
      align-items: center; justify-content: space-between; gap: 16px;
      transition: border-color 0.2s; animation: fadeUp 0.4s ease both;
    }
    .event-card:hover { border-color: rgba(62,207,207,0.3); }
    .event-info { flex: 1; }
    .event-type-badge {
      display: inline-block; border-radius: 8px; padding: 3px 10px;
      font-size: 0.72rem; font-weight: 600; margin-bottom: 6px;
      background: rgba(62,207,207,0.1); border: 1px solid rgba(62,207,207,0.2); color: var(--accent);
    }
    .event-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1rem; margin-bottom: 6px; }
    .event-meta { display: flex; gap: 14px; flex-wrap: wrap; }
    .event-meta span { font-size: 0.78rem; color: var(--muted); }
    .seats-badge {
      display: inline-block; background: rgba(62,207,207,0.1); border: 1px solid rgba(62,207,207,0.2);
      color: var(--success); border-radius: 8px; padding: 3px 10px; font-size: 0.75rem; font-weight: 500;
    }
    .seats-badge.low { background: rgba(255,159,67,0.1); border-color: rgba(255,159,67,0.2); color: var(--warning); }
    .seats-badge.full { background: rgba(255,101,132,0.1); border-color: rgba(255,101,132,0.2); color: var(--danger); }
    .max-info { font-size: 0.73rem; color: var(--warning); margin-top: 4px; }
    .book-section { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-direction: column; }
    .ticket-input-row { display: flex; align-items: center; gap: 6px; }
    .ticket-label { font-size: 0.75rem; color: var(--muted); }
    .ticket-count {
      width: 56px; padding: 8px 10px; background: rgba(255,255,255,0.04);
      border: 1px solid var(--border); border-radius: 10px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 0.88rem; outline: none; text-align: center;
    }
    .ticket-count:focus { border-color: var(--accent); }
    .book-btn {
      background: var(--accent); color: #0a0a0f; border: none; border-radius: 12px;
      padding: 10px 18px; font-family: 'Syne', sans-serif; font-weight: 700;
      font-size: 0.88rem; cursor: pointer; transition: all 0.25s; white-space: nowrap; width: 100%;
    }
    .book-btn:hover { background: #2db8b8; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(62,207,207,0.35); }
    .book-btn:disabled { background: rgba(255,255,255,0.1); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .alert-box { padding: 12px 16px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 20px; display: none; }
    .alert-error { background: rgba(255,101,132,0.12); border: 1px solid rgba(255,101,132,0.3); color: var(--danger); }
    .alert-success { background: rgba(62,207,207,0.12); border: 1px solid rgba(62,207,207,0.3); color: var(--success); }
    .alert-box.show { display: block; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { .event-card { flex-direction: column; align-items: flex-start; } .navbar { padding: 12px 16px; } .main { padding: 24px 16px; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">EventEase</div>
    <div class="navbar-right">
      <div class="user-info">
        <div class="user-name" id="userName">Loading...</div>
        <div class="user-id" id="userId"></div>
      </div>
      <div class="avatar" id="userAvatar">U</div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="main">
    <div class="alert-box alert-error" id="errorMsg"></div>
    <div class="alert-box alert-success" id="successMsg"></div>
    <div class="page-title">Users Page</div>
    <div class="page-subtitle">Browse and book events</div>
    <div class="search-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search events by name, type or location..."/>
    </div>
    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-type="All">All</button>
      <button class="filter-tab" data-type="Workshop">🛠️ Workshop</button>
      <button class="filter-tab" data-type="Hackathon">💻 Hackathon</button>
      <button class="filter-tab" data-type="Conference">🎤 Conference</button>
      <button class="filter-tab" data-type="Seminar">📚 Seminar</button>
      <button class="filter-tab" data-type="Concert">🎵 Concert</button>
      <button class="filter-tab" data-type="Other">📌 Other</button>
    </div>
    <div id="eventsList"><div class="loading">Loading events...</div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/userDashBoard.js"></script>
</body>
</html>
