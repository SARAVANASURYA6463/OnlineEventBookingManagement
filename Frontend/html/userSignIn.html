<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventEase — User Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #111118;
      --border: rgba(255,255,255,0.07);
      --accent: #3ecfcf;
      --text: #f0f0f5;
      --muted: #7a7a8c;
      --danger: #ff6584;
      --success: #3ecfcf;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(62,207,207,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62,207,207,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.2;
    }
    .blob-1 { width: 400px; height: 400px; background: #3ecfcf; top: -100px; right: -100px; }
    .blob-2 { width: 300px; height: 300px; background: #6c63ff; bottom: -80px; left: -80px; }

    .page-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .back-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      z-index: 10;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    .brand {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeDown 0.6s ease both;
    }

    .brand-badge {
      display: inline-block;
      font-size: 11px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(62,207,207,0.12);
      border: 1px solid rgba(62,207,207,0.25);
      border-radius: 100px;
      padding: 6px 18px;
      margin-bottom: 16px;
    }

    .brand h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand p { color: var(--muted); font-size: 0.9rem; margin-top: 8px; }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .form-group { margin-bottom: 20px; }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(62,207,207,0.15);
    }

    .form-group input::placeholder { color: var(--muted); }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #0a0a0f;
      transition: all 0.25s;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      background: #2db8b8;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(62,207,207,0.35);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert-box {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
    }

    .alert-error {
      background: rgba(255,101,132,0.12);
      border: 1px solid rgba(255,101,132,0.3);
      color: var(--danger);
    }

    .alert-success {
      background: rgba(62,207,207,0.12);
      border: 1px solid rgba(62,207,207,0.3);
      color: var(--success);
    }

    .alert-box.show { display: block; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-top-color: #0a0a0f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .spinner.show { display: block; }

    .form-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .form-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .form-footer a:hover { text-decoration: underline; }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <a href="user.html" class="back-btn">← Back</a>

  <div class="page-wrapper">

    <div class="brand">
      <div class="brand-badge">User Sign In</div>
      <h1>Create Account</h1>
      <p>Register to start booking events</p>
    </div>

    <div class="form-card">

      <div class="alert-box alert-error" id="errorMsg"></div>
      <div class="alert-box alert-success" id="successMsg"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your full name"/>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="user@email.com"/>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create a strong password"/>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Repeat your password"/>
      </div>

      <button class="submit-btn" id="signinBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">✨ Create Account</span>
      </button>

      <div class="form-footer">
        Already have an account?
        <a href="userLogIn.html">Login here</a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/userSign.js"></script>
</body>
</html>
