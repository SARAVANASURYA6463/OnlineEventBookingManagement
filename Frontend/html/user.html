<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventEase — User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --card-bg: #111118;
      --border: rgba(255,255,255,0.07);
      --accent: #3ecfcf;
      --text: #f0f0f5;
      --muted: #7a7a8c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(62,207,207,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62,207,207,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.2;
    }
    .blob-1 { width: 400px; height: 400px; background: #3ecfcf; top: -100px; left: -100px; }
    .blob-2 { width: 300px; height: 300px; background: #6c63ff; bottom: -80px; right: -80px; }

    .page-wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .back-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      z-index: 10;
    }
    .back-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    .brand {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .brand-badge {
      display: inline-block;
      font-size: 11px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(62,207,207,0.12);
      border: 1px solid rgba(62,207,207,0.25);
      border-radius: 100px;
      padding: 6px 18px;
      margin-bottom: 16px;
    }

    .brand h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 4vw, 3rem);
      background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand p { color: var(--muted); font-size: 0.95rem; margin-top: 10px; }

    .choice-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .choice-btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.3px;
    }

    .btn-login {
      background: var(--accent);
      color: #0a0a0f;
    }
    .btn-login:hover {
      background: #2db8b8;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(62,207,207,0.35);
    }

    .btn-signin {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-signin:hover {
      background: rgba(255,255,255,0.1);
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.15);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <a href="Home.html" class="back-btn">← Back</a>

  <div class="page-wrapper">

    <div class="brand">
      <div class="brand-badge">User</div>
      <h1>Welcome Back</h1>
      <p>Login or create a new user account</p>
    </div>

    <div class="choice-card">
      <button class="choice-btn btn-login" id="loginBtn">
        🔑 Login
      </button>
      <div class="divider">or</div>
      <button class="choice-btn btn-signin" id="signinBtn">
        ✨ Create Account (Sign In)
      </button>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/user.js"></script>
</body>
</html>
